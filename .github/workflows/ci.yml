name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install dependencies
        run: dnf install -y git gcc gcc-c++ clang cmake ninja-build mold python3

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Cache FetchContent dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .deps
          key: fedora-44-deps-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: fedora-44-deps-

      - name: Build all configurations
        run: python3 scripts/build_matrix.py -s none --unity

  test:
    name: Test
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install dependencies
        run: dnf install -y git gcc gcc-c++ clang cmake ninja-build mold python3 libasan libubsan

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Cache FetchContent dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .deps
          key: fedora-44-deps-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: fedora-44-deps-

      - name: Build and test all configurations
        run: python3 scripts/build_matrix.py --no-examples --test --unity

  lint:
    name: Lint
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install dependencies
        run: dnf install -y git clang clang-tools-extra cmake ninja-build mold

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Cache FetchContent dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .deps
          key: fedora-44-deps-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: fedora-44-deps-

      - name: Run Clang-Format
        run: find src include test -name '*.cpp' -o -name '*.hpp' | xargs clang-format --dry-run --Werror

      - name: Run Clang-Tidy
        run: ./scripts/run_clang_tidy.sh
